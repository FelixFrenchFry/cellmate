name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.simd }} / OpenMP ${{ matrix.openmp }}
    runs-on: ${{ matrix.toolchain.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # total of 12 combinations (3 compilers x 2 backends x 2 OpenMP settings)
      matrix:
        toolchain:
          # GCC 15 on Linux
          - name: GCC 15
            os: ubuntu-26.04
            generator: Ninja
            configure_args: -DCMAKE_CXX_COMPILER=g++-15
            compiler_id: GNU
            compiler_version: '15'
            avx256_flags: -mavx2
            executable: build/tests/cellmate_tests
          # Clang 21 on Linux
          - name: Clang 21
            os: ubuntu-26.04
            generator: Ninja
            configure_args: -DCMAKE_CXX_COMPILER=clang++-21
            compiler_id: Clang
            compiler_version: '21'
            avx256_flags: -mavx2
            executable: build/tests/cellmate_tests
          # MSVC 19.44 (VS 2022) on Windows
          - name: MSVC 19.44 (VS 2022)
            os: windows-2022
            generator: Visual Studio 17 2022
            configure_args: -A x64 -T "v143,version=14.44"
            compiler_id: MSVC
            compiler_version: '19.44'
            avx256_flags: /arch:AVX2
            executable: build/tests/Release/cellmate_tests.exe
        simd: [SCALAR, AVX256]
        openmp: ['OFF', 'ON']
    # use 2 OpenMP threads without dynamic team-size adjustment
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Clang OpenMP runtime
        if: matrix.toolchain.name == 'Clang 21' && matrix.openmp == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libomp-21-dev

      # include benchmark configuration tests, but performance benchmarks are not run
      - name: Configure tests
        run: >-
          cmake -S . -B build -G "${{ matrix.toolchain.generator }}"
          ${{ matrix.toolchain.configure_args }}
          "-DCMAKE_PROJECT_cellmate_INCLUDE=${{ github.workspace }}/.github/check_compiler.cmake"
          -DCELLMATE_CI_COMPILER_ID=${{ matrix.toolchain.compiler_id }}
          -DCELLMATE_CI_COMPILER_VERSION=${{ matrix.toolchain.compiler_version }}
          -DCMAKE_BUILD_TYPE=Release
          -DCELLMATE_BUILD_TESTS=ON
          -DCELLMATE_BUILD_BENCHMARKS=ON
          -DCELLMATE_BUILD_EXAMPLES=OFF
          -DCELLMATE_SIMD=${{ matrix.simd }}
          -DCELLMATE_ENABLE_OPENMP=${{ matrix.openmp }}
          "-DCELLMATE_TEST_ARCH_FLAGS=${{ matrix.simd == 'AVX256' && matrix.toolchain.avx256_flags || '' }}"

      - name: Build tests
        run: cmake --build build --config Release --target cellmate_tests --parallel 2

      - name: Run tests
        run: ./${{ matrix.toolchain.executable }}
